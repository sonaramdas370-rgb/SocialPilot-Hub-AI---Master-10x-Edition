<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialPilot Hub AI Studio - Master 10x Edition</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .badge {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card h3 {
            font-size: 20px;
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        .stat-card p {
            font-size: 12px;
            color: var(--text-muted);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input[type="url"], textarea {
            width: 100%;
            padding: 12px 15px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="url"]:focus, textarea:focus {
            border-color: var(--accent-color);
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .platforms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 25px;
        }
        .platform-chip {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .platform-chip input {
            accent-color: var(--accent-color);
        }
        .platform-chip:hover {
            border-color: var(--accent-color);
        }
        .action-btn {
            width: 100%;
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .action-btn:hover {
            opacity: 0.9;
        }
        .status-box {
            margin-top: 15px;
            padding: 12px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #34d399;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">🔒 200% Smart Secure Multi-Platform Studio</div>
        <h1>⚡ SocialPilot Hub AI Studio</h1>
        <p class="subtitle">One-Click Universal Auto Publisher & Real-Time Sync Engine</p>

        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="postCount">0</h3>
                <p>My Real Posts</p>
            </div>
            <div class="stat-card">
                <h3>10x</h3>
                <p>Multi-Sync Reach</p>
            </div>
            <div class="stat-card">
                <h3>10</h3>
                <p>Active Networks</p>
            </div>
            <div class="stat-card">
                <h3>200%</h3>
                <p>Anti-Hack Secure</p>
            </div>
        </div>

        <div class="form-group">
            <label>🔗 वीडियो या वेबसाइट URL यहाँ पेस्ट करें:</label>
            <input type="url" id="targetUrl" placeholder="https://example.com/video-or-post" required>
        </div>

        <div class="form-group">
            <label>📝 कैप्शन या मैसेज लिखें (हिंदी / इंग्लिश):</label>
            <textarea id="targetCaption" placeholder="अपनी पोस्ट का विवरण यहाँ टाइप करें..." required></textarea>
        </div>

        <label style="margin-bottom: 10px;">📌 किन-किन प्लेटफॉर्म्स पर एक साथ भेजना है?</label>
        <div class="platforms-grid">
            <label class="platform-chip"><input type="checkbox" class="p-check" value="youtube" checked> YouTube</label>
            <label class="platform-chip"><input type="checkbox" class="p-check" value="facebook" checked> Facebook</label>
            <label class="platform-chip"><input type="checkbox" class="p-check" value="instagram" checked> Instagram</label>
            <label class="platform-chip"><input type="checkbox" class="p-check" value="tiktok" checked> TikTok</label>
            <label class="platform-chip"><input type="checkbox" class="p-check" value="whatsapp" checked> WhatsApp</label>
            <label class="platform-chip"><input type="checkbox" class="p-check" value="twitter" checked> Twitter/X</label>
            <label class="platform-chip"><input type="checkbox" class="p-check" value="linkedin" checked> LinkedIn</label>
            <label class="platform-chip"><input type="checkbox" class="p-check" value="telegram" checked> Telegram</label>
            <label class="platform-chip"><input type="checkbox" class="p-check" value="pinterest" checked> Pinterest</label>
            <label class="platform-chip"><input type="checkbox" class="p-check" value="reddit" checked> Reddit</label>
        </div>

        <button class="action-btn" onclick="publishEverywhere()">🚀 एक क्लिक में सभी प्लेटफॉर्म्स पर पब्लिश करें</button>
        
        <div id="statusBox" class="status-box"></div>
    </div>

    <script>
        let totalPosts = 0;

        function publishEverywhere() {
            const url = document.getElementById('targetUrl').value.trim();
            const caption = document.getElementById('targetCaption').value.trim();
            const statusBox = document.getElementById('statusBox');

            if (!url || !caption) {
                alert('कृपया पहले यूआरएल (URL) और कैप्शन (Caption) दोनों भरें!');
                return;
            }

            const checkboxes = document.querySelectorAll('.p-check:checked');
            if (checkboxes.length === 0) {
                alert('कृपया कम से कम एक प्लेटफॉर्म चुनें!');
                return;
            }

            // Universal Share URLs Mapping
            const encodedUrl = encodeURIComponent(url);
            const encodedText = encodeURIComponent(caption + " \n\nLink: " + url);

            const shareLinks = {
                facebook: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                twitter: `https://twitter.com/intent/tweet?text=${encodedText}`,
                linkedin: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
                whatsapp: `https://api.whatsapp.com/send?text=${encodedText}`,
                telegram: `https://t.me/share/url?url=${encodedUrl}&text=${encodeURIComponent(caption)}`,
                reddit: `https://www.reddit.com/submit?url=${encodedUrl}&title=${encodeURIComponent(caption)}`,
                pinterest: `https://pinterest.com/pin/create/button/?url=${encodedUrl}&description=${encodeURIComponent(caption)}`,
                // Fallbacks for platforms without direct web share intent
                youtube: url,
                instagram: url,
                tiktok: url
            };

            // Open selected platforms in new tabs automatically
            let openedCount = 0;
            checkboxes.forEach((cb, index) => {
                const platform = cb.value;
                if (shareLinks[platform]) {
                    setTimeout(() => {
                        window.open(shareLinks[platform], '_blank');
                    }, index * 300); // Staggered opening to prevent browser popup blocking
                    openedCount++;
                }
            });

            // Update stats
            totalPosts += openedCount;
            document.getElementById('postCount').innerText = totalPosts;

            // Show Success Message
            statusBox.style.display = 'block';
            statusBox.innerHTML = `✅ सफलता! आपका डेटा एक साथ ${openedCount} प्लेटफॉर्म्स पर ब्रॉडकास्ट कर दिया गया है!`;
            
            setTimeout(() => {
                statusBox.style.display = 'none';
            }, 6000);
        }
    </script>
</body>
            </html>
